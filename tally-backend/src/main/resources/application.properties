server.port=9090
ingest.base-url=${INGEST_BASE_URL:http://127.0.0.1:8082}
ingest.agent-key=${INGEST_AGENT_KEY:local-dev-key}
auth.token-secret=${AUTH_TOKEN_SECRET:local-dev-key}
auth.token-ttl-sec=3600
auth.accept-static-agent-key=${AUTH_ACCEPT_STATIC_AGENT_KEY:false}
auth.cookie-secure-mode=${AUTH_COOKIE_SECURE_MODE:auto}
connector.allow-direct-base-url-override=${CONNECTOR_ALLOW_DIRECT_BASE_URL_OVERRIDE:false}
# Default to local MariaDB so backend reads and writes persist there directly.
# Environment variables can still override these in shared environments.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://127.0.0.1:3306/tallyconnector?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.sql.init.mode=always
spring.sql.init.continue-on-error=true
spring.sql.init.schema-locations=classpath:schema.sql

spring.datasource.username=${SPRING_DATASOURCE_USERNAME:tallyapp}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:tallyapp123}
spring.jpa.database=${SPRING_JPA_DATABASE:mysql}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:com.mysql.cj.jdbc.Driver}

# Bootstrap user seeds the DB only on first run; runtime login always reads auth_users from the database.
auth.bootstrap.enabled=true
auth.bootstrap.username=admin
auth.bootstrap.password=${AUTH_BOOTSTRAP_PASSWORD:admin@123}
auth.bootstrap.display-name=Administrator
auth.bootstrap.roles=ADMIN
auth.bootstrap.active=true
connector.registry.file=connector-registry.json
# connector.auto-route.by-client-ip=true
connector.auto-route.by-client-ip=false
connector.auto-route.port=8082
tally.sync.target-url=${TALLY_SYNC_TARGET_URL:http://127.0.0.1:9000}
tally.cache.sync.enabled=${TALLY_CACHE_SYNC_ENABLED:true}
tally.cache.sync.interval-ms=${TALLY_CACHE_SYNC_INTERVAL_MS:10000}
tally.cache.sync.stale-after-ms=${TALLY_CACHE_SYNC_STALE_AFTER_MS:300000}
tally.cache.sync.company=${TALLY_CACHE_SYNC_COMPANY:}
tally.write.queue.enabled=${TALLY_WRITE_QUEUE_ENABLED:true}
tally.write.queue.auto-process-approved=${TALLY_WRITE_QUEUE_AUTO_PROCESS_APPROVED:true}
tally.write.queue.retry-interval-ms=${TALLY_WRITE_QUEUE_RETRY_INTERVAL_MS:10000}
tally.write.queue.batch-size=${TALLY_WRITE_QUEUE_BATCH_SIZE:10}
tally.write.queue.max-attempts=${TALLY_WRITE_QUEUE_MAX_ATTEMPTS:-1}
logging.level.root=${LOGGING_LEVEL_ROOT:INFO}
